# Public bodies whose decisions give money to Tinos. Searched with `tinos fulltext-backfill`
# (Diavgeia full-text search), never ingested as our own acts. The Interior Ministry changed
# its Diavgeia uid with each reorganisation; active_years are the years its acts naming ΤΗΝΟΥ
# fall in (probe 2026-09-25). The index holds document text only from about November 2015;
# earlier acts match by subject alone, so 2015 is searched with the term ΑΥΤΟΤΕΛΕΙΣ (every ΚΑΠ
# decision's subject) as well. Uid 12 (the 2009-2011 ministry) is not searched.
# `group` is the grantor as the curated layer reports it (a ministry under all its uids, the Region with its
# development fund); `keep` narrows what the privacy whitelist keeps from that issuer (PRIVACY.md Q7).
# Public-investment project codes of a Tinos body's projects. A search for one anchors every hit to that body, as its
# ΑΦΜ does (PRIVACY.md Q7): the Economy Ministry's transfers for the waste-processing project name neither the
# municipality's ΑΦΜ nor Tinos in every act (FINDINGS F12).
