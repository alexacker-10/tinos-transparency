duplicate:
  - ada: 61ΘΚΩΗ6-4ΤΛ
    entity: "6296"
    duplicate_of: ΨΧΥΧΩΗ6-8ΚΖ
    payment_order: "ΧΡΗΜΑΤΙΚΟ ΕΝΤΑΛΜΑ 1.835, 8th invoice 393 of 19/12/2022, 154,224.42"
    document: data/raw/diavgeia/docs/6296/61ΘΚΩΗ6-4ΤΛ.pdf
    document_sha256: ae1c6daeb862b825b8982775c8e97a556bb6348783c57968e0fe56912fb7e0fd
    duplicate_of_document_sha256: 7561033887483d9a089e327362728b582e4875f070b80cbf12bfd17349ebcc69
    checked_on: 2026-09-25
    note: >
      Both acts are payment order 1.835 (protocol 1835) for the same ΕΣΠΑ water-network invoice.
      ΨΧΥΧΩΗ6-8ΚΖ was published at 08:45:34 UTC on 2022-12-22 and corrected at 09:26 (it carries
      a correctedVersionId); 61ΘΚΩΗ6-4ΤΛ was submitted 21 seconds after the first and never
      corrected or revoked. Their withholdings differ by one 15,16 line. The statement counts the
      payment once: ΚΑΕ 7312 in 2022 exceeded it by exactly 154,224.42 while both were counted.
