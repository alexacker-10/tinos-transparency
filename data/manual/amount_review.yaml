# Human-verified amount checks against the source document. Tracked in git.
# The curated build applies `amount_suspect = true, suspect_reason = 'document_mismatch'`
# to the payment lines of any ADA listed under `mismatch`: every line of the act, or
# only sponsor line `line_no` when one is given (the build then fails unless that line
# still carries `metadata_amount`, and `kae` if given). Acts under `duplicate` re-post a
# payment order that `duplicate_of` already records: all their lines are flagged
# `duplicate_posting`. Nothing is corrected: the metadata amount stays in the table,
# flagged, and the document's figure is recorded here for the reader. Most entries
# below were found by reconciling Β.2.2 lines with the year-end execution statements
# (release view v_kae_reconciliation, FINDINGS.md F7).
